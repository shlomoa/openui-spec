minimum_pre_commit_version: 4.6.0

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
        # TypeScript tsconfig files are JSONC and may contain comments.
        # Invalid conformance documents may be invalid JSON on purpose.
        exclude: '(^|/)tsconfig(?:\.[^/]+)?\.json$|^spec/conformance/invalid/[^/]*(?<!\.expected)\.json$'
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.4
    hooks:
      - id: prettier
        types_or: [json, markdown]
        # Invalid conformance documents are test data, read as raw text.
        exclude: '^spec/conformance/invalid/[^/]*(?<!\.expected)\.json$'

  - repo: local
    hooks:
      - id: openui-grammar-consistency
        name: OpenUI grammar consistency
        entry: python -m spec.bin.check_grammar_consistency
        language: python
        additional_dependencies:
          - jsonschema==4.26.0
          - TatSu==5.24.0
        files: ^(SCHEMA_VERSION|bin/openui_document\.py|spec/(EBNF\.txt|openui\.json|openui\.schema\.json|README\.md|scopes/.*|bin/to_json/.*|bin/check_grammar_consistency/.*|conformance/.*)|tests/test_grammar_consistency\.py)$
        pass_filenames: false
      - id: comparison-cases
        name: Comparison cases up to date
        entry: python -m spec.bin.generate_comparison_cases --check
        language: python
        files: ^(SCHEMA_VERSION|spec/conformance/comparison/.*|spec/bin/generate_comparison_cases\.py)$
        pass_filenames: false
      - id: openui-spec-lint
        name: OpenUI spec-content lint
        entry: python -m spec.bin.lint_spec
        language: python
        files: ^spec/(scopes/|bin/lint_spec\.py$|.*\.md$)
        pass_filenames: false
      - id: taxonomy-html
        name: Taxonomy HTML pages up to date
        entry: python -m spec.bin.render_taxonomy_html --check
        language: python
        additional_dependencies:
          - Markdown==3.11
        files: ^(spec/taxonomy/(generic-ui|ui-element)-taxonomy\.(md|html)|spec/taxonomy/images/.*\.svg|spec/bin/render_taxonomy_html\.py)$
        pass_filenames: false
      - id: taxonomy-tree-html
        name: Taxonomy tree HTML up to date
        entry: python -m spec.bin.render_taxonomy_tree --check
        language: python
        additional_dependencies:
          - Markdown==3.11
        files: ^(spec/scopes/taxonomy_mapping\.md|spec/taxonomy/taxonomy-tree\.html|spec/bin/render_taxonomy_tree\.py)$
        pass_filenames: false
      - id: markdown-internal-links
        name: Markdown internal links
        entry: python -m spec.bin.check_links
        language: python
        types: [markdown]
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: node
        additional_dependencies:
          - markdownlint-cli2@0.22.1
        types: [markdown]
