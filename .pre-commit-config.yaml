minimum_pre_commit_version: 4.6.0
exclude: ^spec/survey/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
        # TypeScript tsconfig files are JSONC and may contain comments.
        exclude: '(^|/)tsconfig(?:\.[^/]+)?\.json$'
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.4
    hooks:
      - id: prettier
        types_or: [json, markdown]

  - repo: local
    hooks:
      - id: openui-grammar-consistency
        name: OpenUI grammar consistency
        entry: python spec/tooling/check_grammar_consistency.py
        language: python
        additional_dependencies:
          - jsonschema==4.26.0
          - TatSu==5.24.0
        files: ^(spec/(EBNF\.txt|openui\.schema\.json|README\.md|tooling/check_grammar_consistency\.py)|tests/test_grammar_consistency\.py)$
        pass_filenames: false
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: node
        additional_dependencies:
          - markdownlint-cli2@0.22.1
        types: [markdown]
