# Publishes the openui-spec distribution to PyPI on GitHub release.
# Uses PyPI Trusted Publishing (OIDC): configure a trusted publisher for this
# repository/workflow on PyPI and add a "pypi" environment before first use.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
