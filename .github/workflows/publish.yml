# Publishes the openui-spec distribution to PyPI and npm on GitHub release.
# PyPI uses PyPI Trusted Publishing (OIDC): configure a trusted publisher for this
# repository/workflow on PyPI and add a "pypi" environment before first use.
# npm uses NPM_TOKEN secret: configure NPM_TOKEN in repository secrets.
name: Publish OpenUi Specification

on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: npm dist-tag to publish under
        required: true
        default: latest

jobs:
  publish-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish package to npm
        run: npm publish ./dist/openui-spec --access public --tag "${{ inputs.npm-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
